# Minimal CLIProxyAPI configuration for container runtime.
host: ""
port: 7860

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

auth-dir: "~/.cli-proxy-api"

api-keys:
  - "replace-with-real-api-key"

debug: false

plugins:
  enabled: false
  dir: "plugins"
